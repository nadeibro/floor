name: floor_generator
description: >
  The typesafe, reactive, and lightweight SQLite abstraction for your Flutter applications.
  This library is the dev dependency.
version: 1.4.2
homepage: https://pinchbv.github.io/floor/
repository: https://github.com/pinchbv/floor
issue_tracker: https://github.com/pinchbv/floor/issues
publish_to: none

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0 <4.0.0"

dependencies:
  analyzer: ">=7.4.0 <8.0.0"
  build: ^3.0.0
  build_config: ^1.0.0
  code_builder: ^4.11.0
  collection: ^1.14.0
  floor_annotation:
    path: ../floor_annotation
  meta:
  source_gen: ^3.0.0
  strings: ^4.0.1

dev_dependencies:
  build_test: ^3.3.0
  dart_style: ">=2.3.7 <4.0.0"
  mockito: ^5.5.0
  path: ^1.8.0
  pub_semver: ^2.1.5
  test: ^1.26.3
